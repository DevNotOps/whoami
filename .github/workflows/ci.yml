name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: flake8 app tests --max-line-length 100
      - run: pytest -q
      - name: Ansible syntax check
        working-directory: ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/hosts.ini site.yml --syntax-check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t whoami:ci --build-arg APP_VERSION=${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name w -p 8080:8080 whoami:ci
          for i in $(seq 1 15); do curl -fs localhost:8080/health && break || sleep 1; done
          curl -fs localhost:8080/ | tee /dev/stderr | grep -q '"service":"whoami"'
